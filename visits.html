<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Health Worker Visit Tracker - Visits</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="households.html">Households</a>
      <a href="visits.html" class="active">Visits</a>
      <a href="followups.html">Follow‑ups</a>
      <a href="reports.html">Reports</a>
    </nav>
  </header>
  <div class="main-container">
    <h1>Visits</h1>
    <div class="card">
      <h2>Schedule / Edit Visit</h2>
      <form id="visit-form">
        <input type="hidden" id="visit-id" />
        <div class="form-group">
          <label for="visit-household">Household</label>
          <select id="visit-household" required></select>
        </div>
        <div class="form-group">
          <label for="visit-date">Visit Date</label>
          <input type="date" id="visit-date" required />
        </div>
        <div class="form-group">
          <label for="visit-purpose">Purpose</label>
          <input type="text" id="visit-purpose" required />
        </div>
        <div class="form-group">
          <label for="visit-status">Status</label>
          <select id="visit-status" required>
            <option value="Scheduled">Scheduled</option>
            <option value="Completed">Completed</option>
            <option value="Pending">Pending</option>
            <option value="Missed">Missed</option>
          </select>
        </div>
        <button type="submit" id="save-visit-btn">Save Visit</button>
        <button type="button" id="cancel-visit-btn" class="hidden">Cancel</button>
      </form>
    </div>

    <div class="card table-wrapper">
      <h2>Visit List</h2>
      <input type="text" id="visit-search" placeholder="Search visits..." />
      <table id="visit-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Household</th>
            <th>Date</th>
            <th>Purpose</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="visit-empty" class="hidden">No visits recorded.</p>
    </div>
  </div>
  <script src="./js/common.js"></script>
  <script src="./js/visits.js"></script>
</body>
</html>
