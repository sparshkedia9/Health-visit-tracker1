<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Health Worker Visit Tracker - Households</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="households.html" class="active">Households</a>
      <a href="visits.html">Visits</a>
      <a href="followups.html">Follow‑ups</a>
      <a href="reports.html">Reports</a>
    </nav>
  </header>
  <div class="main-container">
    <h1>Households</h1>
    <div class="card">
      <h2>Add / Edit Household</h2>
      <form id="household-form">
        <input type="hidden" id="household-id" />
        <div class="form-group">
          <label for="head-name">Head of Household Name</label>
          <input type="text" id="head-name" required />
        </div>
        <div class="form-group">
          <label for="contact-number">Contact Number</label>
          <input type="tel" id="contact-number" required />
        </div>
        <div class="form-group">
          <label for="address">Address</label>
          <input type="text" id="address" required />
        </div>
        <div class="form-group">
          <label for="members-count">Number of Family Members</label>
          <input type="number" id="members-count" min="1" required />
        </div>
        <div class="form-group">
          <label for="observations">General Observations</label>
          <textarea id="observations"></textarea>
        </div>
        <button type="submit" id="save-btn">Save Household</button>
        <button type="button" id="cancel-btn" class="hidden">Cancel</button>
      </form>
    </div>

    <div class="card table-wrapper">
      <h2>Household List</h2>
      <input type="text" id="search-box" placeholder="Search households..." />
      <table id="household-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Head</th>
            <th>Contact</th>
            <th>Address</th>
            <th>Members</th>
            <th>Observations</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="empty-state" class="hidden">No household records found.</p>
    </div>
  </div>
  <script src="./js/common.js"></script>
  <script src="./js/households.js"></script>
</body>
</html>
