<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Health Worker Visit Tracker - Visit Details</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="households.html">Households</a>
      <a href="visits.html">Visits</a>
      <a href="followups.html">Follow‑ups</a>
      <a href="reports.html">Reports</a>
    </nav>
  </header>
  <div class="main-container">
    <h1>Visit Details</h1>
    <div class="card">
      <form id="details-form">
        <input type="hidden" id="visit-id" />
        <div class="form-group">
          <label>Household:</label>
          <p id="household-name"></p>
        </div>
        <div class="form-group">
          <label for="visit-date">Visit Date</label>
          <input type="date" id="visit-date" required />
        </div>
        <div class="form-group">
          <label for="visit-purpose">Purpose</label>
          <input type="text" id="visit-purpose" required />
        </div>
        <h3>Checklist</h3>
        <div class="form-group">
          <label><input type="checkbox" id="chk-health" /> General health check completed</label>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="chk-medicine" /> Medicine review completed</label>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="chk-nutrition" /> Nutrition guidance provided</label>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="chk-vaccination" /> Vaccination status checked</label>
        </div>
        <div class="form-group">
          <label for="visit-notes">Visit notes / additional observations</label>
          <textarea id="visit-notes"></textarea>
        </div>
        <div class="form-group">
          <label for="next-followup">Next follow‑up date</label>
          <input type="date" id="next-followup" />
        </div>
        <div class="form-group">
          <label for="visit-status">Status</label>
          <select id="visit-status">
            <option value="Scheduled">Scheduled</option>
            <option value="Completed">Completed</option>
            <option value="Pending">Pending</option>
            <option value="Missed">Missed</option>
          </select>
        </div>
        <button type="submit">Save Details</button>
      </form>
    </div>
  </div>
  <script src="./js/common.js"></script>
  <script src="./js/visit-details.js"></script>
</body>
</html>
