<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Health Worker Visit Tracker - Follow‑ups</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="households.html">Households</a>
      <a href="visits.html">Visits</a>
      <a href="followups.html" class="active">Follow‑ups</a>
      <a href="reports.html">Reports</a>
    </nav>
  </header>
  <div class="main-container">
    <h1>Follow‑ups</h1>
    <div class="card table-wrapper">
      <h2>Pending Follow‑ups</h2>
      <input type="text" id="followup-search" placeholder="Search..." />
      <table id="followup-table">
        <thead>
          <tr>
            <th>Household</th>
            <th>Previous Visit</th>
            <th>Next Follow‑up</th>
            <th>Reason</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="followup-empty" class="hidden">No follow‑ups pending.</p>
    </div>
  </div>
  <script src="./js/common.js"></script>
  <script src="./js/followups.js"></script>
</body>
</html>
